<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{post.titulo}}</title>
</head>
<body>
      <h1>{{ post.titulo }}</h1>

    <p>Autor: {{ post.autor }}</p>
    <p>Fecha: {{ post.fecha_creacion }}</p>

    {% if post.imagen %}
        <img src="{{ post.imagen.url }}" width="400">
    {% endif %}

    <p>{{ post.contenido }}</p>

    <a href="{% url 'inicio' %}">Volver al inicio</a>
    {% if user == post.autor %}
    <a href="{% url 'editar_post' post.pk %}">
        Editar publicación
    </a>
    <a href="{% url 'eliminar_post' post.pk %}">
    Eliminar publicación
    </a>
    {% endif %}
</body>
</html>
